services:
  frontend:
    build: ../frontend
    ports:
      - 8083:80
  backend:
    build: ../backend
    ports:
      - 8080:5001
    env_file:
      env/backend.env
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - 8081:8080
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      - keycloak-data:/opt/keycloak/data
    command: start-dev --health-enabled=true
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/health/live']
      interval: 5s
      timeout: 5s
      retries: 5
  database:
    image: postgres:17
    container_name: postgres-17
    ports:
      - 8082:5432
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    env_file:
      - env/db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visp0 -d gaming-forum"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  keycloak-data:
  pgdata:
    driver: local